packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  core-js: true
  esbuild: true
  onnxruntime-node: true

catalog:
  '@biomejs/biome': 2.5.11
  '@hono/node-server': 2.1.1
  '@types/node': 22.20.1
  '@types/pngjs': 6.0.5
  hono: 4.13.5
  onnxruntime-node: 1.29.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  pngjs: 7.0.0
  tsdown: 0.22.12
  tsx: 4.23.13
  typescript: 6.0.3
  vitest: 4.1.11

# onnxruntime-node はプラットフォーム別のネイティブバイナリを含む。
# pnpm 10 はデフォルトで依存のビルドスクリプトを実行しないため、明示的に許可する。
onlyBuiltDependencies:
  - '@biomejs/biome'
  - core-js
  - esbuild
  - onnxruntime-node
