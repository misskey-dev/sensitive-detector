packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  core-js: true
  esbuild: true
  onnxruntime-node: true

catalog:
  '@biomejs/biome': 2.6.4
  '@hono/node-server': 2.1.5
  '@types/node': 22.20.5
  '@types/pngjs': 6.0.5
  hono: 4.13.14
  onnxruntime-node: 1.31.1
  pino: 10.4.0
  pino-pretty: 13.2.0
  pngjs: 7.0.0
  tsdown: 0.23.4
  tsx: 4.23.15
  typescript: 7.0.2
  vitest: 4.1.12

# onnxruntime-node はプラットフォーム別のネイティブバイナリを含む。
# pnpm 10 はデフォルトで依存のビルドスクリプトを実行しないため、明示的に許可する。
onlyBuiltDependencies:
  - '@biomejs/biome'
  - core-js
  - esbuild
  - onnxruntime-node
